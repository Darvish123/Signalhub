name: Bitunix public connectivity
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/risk-sizing-v0.6"
jobs:
  bitunix-public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check public Bitunix Futures API
        run: python -m scripts.check_bitunix_connection
