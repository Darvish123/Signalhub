name: tests

on:
  # Run once per pull-request update instead of duplicating every feature-branch
  # push with both push and pull_request events.
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# Cancel stale runs for the same PR/ref when a newer commit arrives.
concurrency:
  group: signalhub-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 2>&1 | tee pip-install.log
      - name: Run unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Compile application and scripts
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q app scripts 2>&1 | tee compileall.log
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            pip-install.log
            unittest.log
            compileall.log
          if-no-files-found: warn
          retention-days: 7
