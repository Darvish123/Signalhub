name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 2>&1 | tee pip-install.log
      - name: Run unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Compile application and scripts
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q app scripts 2>&1 | tee compileall.log
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            pip-install.log
            unittest.log
            compileall.log
          if-no-files-found: warn
          retention-days: 14
